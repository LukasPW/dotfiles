# swayfx-only effects. Vanilla sway rejects these commands, so this file
# is included from hosts/<hostname>.conf only on machines running swayfx.
# Reference: the swayfx README on GitHub.
# No equivalent for Hyprland animations or blur vibrancy.

corner_radius 0

shadows enable
shadow_blur_radius 4
shadow_color $shadow

# Blur only shows behind transparent windows/surfaces.
blur enable
blur_passes 2
blur_radius 8
