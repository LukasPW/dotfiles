# Desktop: pin workspaces 1-5 to DP-1 and 6-10 to DP-2.
# On startup each output shows the first workspace assigned to it
# (1 and 6), like `default = true` in hyprland.lua.
workspace number 1 output DP-1
workspace 2 output DP-1
workspace 3 output DP-1
workspace 4 output DP-1
workspace 5 output DP-1

workspace number 6  output DP-2
workspace 7  output DP-2
workspace 8  output DP-2
workspace 9  output DP-2
workspace 10 output DP-2

# Remove if this machine runs vanilla sway instead of swayfx.
include ~/.config/sway/fx.conf
