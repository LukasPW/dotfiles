# Monitors
monitor_rule=name:^DP-1$,width:2560,height:1440,refresh:144,x:0,y:0,scale:1,primary:1
monitor_rule=name:^DP-2$,width:1920,height:1080,refresh:60,x:2560,y:360,scale:1

# View tag: SUPER+1-5 → DP-1, SUPER+6-0 → DP-2
bind=SUPER,1,viewcrossmon,1,DP-1
bind=SUPER,2,viewcrossmon,2,DP-1
bind=SUPER,3,viewcrossmon,3,DP-1
bind=SUPER,4,viewcrossmon,4,DP-1
bind=SUPER,5,viewcrossmon,5,DP-1
bind=SUPER,6,viewcrossmon,1,DP-2
bind=SUPER,7,viewcrossmon,2,DP-2
bind=SUPER,8,viewcrossmon,3,DP-2
bind=SUPER,9,viewcrossmon,4,DP-2
bind=SUPER,0,viewcrossmon,5,DP-2

# Move window to tag: same mapping
bind=SUPER+SHIFT,1,tagcrossmon,1,DP-1
bind=SUPER+SHIFT,2,tagcrossmon,2,DP-1
bind=SUPER+SHIFT,3,tagcrossmon,3,DP-1
bind=SUPER+SHIFT,4,tagcrossmon,4,DP-1
bind=SUPER+SHIFT,5,tagcrossmon,5,DP-1
bind=SUPER+SHIFT,6,tagcrossmon,1,DP-2
bind=SUPER+SHIFT,7,tagcrossmon,2,DP-2
bind=SUPER+SHIFT,8,tagcrossmon,3,DP-2
bind=SUPER+SHIFT,9,tagcrossmon,4,DP-2
bind=SUPER+SHIFT,0,tagcrossmon,5,DP-2

allow_tearing=0
