# TTY escape hatch if the QuickShell lockscreen ever gets stuck: switch to a TTY
# (e.g. Ctrl+Alt+F2), log in, run `pkill quickshell` to kill the lock client.
# Hyprland will then show its own "crashed lockscreen" recovery screen instead of
# unlocking - clear it with: hyprctl --instance 0 eval 'hl.clear_crashed_lockscreen()'
# then switch back with Ctrl+Alt+F1 (or whichever VT Hyprland is running on).

general {
    # lock_cmd = hyprlock -- old: hyprlock
    lock_cmd = qs ipc call lock lock
    # before_sleep_cmd = hyprlock -- old: hyprlock
    before_sleep_cmd = qs ipc call lock lock
}

listener {
    timeout = 500       # 5 min - lock screen
    # on-timeout = hyprlock -- old: hyprlock
    on-timeout = qs ipc call lock lock
}

listener {
    timeout = 600       # 10 min - turn off displays
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Removed: `listener { event = lid/before-sleep ... }` blocks. This hypridle version
# (0.1.8) doesn't support `event =` listeners at all (config error: "listener:event
# does not exist") - checked against the version's own bundled sample config. Before-sleep
# locking is already handled above via general.before_sleep_cmd, which IS supported.
# Lid-close locking is now handled via a Hyprland-level bind instead (see hyprland.lua).
