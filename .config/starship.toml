add_newline = false

format = "$custom$username$hostname$directory$git_branch $character"

[username]
show_always = false
style_user = "#c4c0ff"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "#c4c0ff"
format = "[@$hostname ]($style)"

[directory]
style = "#c4c0ff"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ""
style = "#c7c4dc"
format = " ([($branch)]($style))"

[character]
success_symbol = "[➜](bold #c7c4dc)"
error_symbol = "[➜](bold red)"
vicmd_symbol = "[❮](bold yellow)"

[custom.logo]
command = "echo "
when = "true"
style ="#c4c0ff"
format = "[$output]($style) "
